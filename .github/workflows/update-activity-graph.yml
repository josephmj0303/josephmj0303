name: Update GitHub Activity Graph

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate activity graph
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIVITY_TOKEN }}
          GITHUB_USERNAME: josephmj0303
        run: python scripts/generate_activity_graph.py

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-graph.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update GitHub activity graph"
            git push
          fi
